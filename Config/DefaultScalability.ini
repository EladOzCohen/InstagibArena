; Instagib Arena scalability: only the keys that differ from the engine's BaseScalability.ini are listed here.
;
; Measured on an Intel Iris Xe laptop (1280x720, Forge, see docs/DEVELOPMENT.md section 18): at the engine's Epic level
; Temporal Super Resolution cost 20 of 37 ms (RejectShading 14 ms, UpdateHistory at 200 percent history 3.6 ms), everything
; else together (base pass 1 ms, shadows 2.6 ms, lighting 5.6 ms) stayed under 17 ms. So anti-aliasing is what the levels change:
;   Low, Medium : TAA (nearly free, upscales from the lower resolution scale below)
;   High        : TSR with a light configuration
;   Epic        : unchanged engine TSR (history at 200 percent, flicker rejection, resurrection)

[ScalabilitySettings]
; Resolution scale of the Quality buttons: Low, Medium, High, Epic (the engine's default is 50 71 87 100: far too blurry at Low).
PerfIndexValues_ResolutionQuality="70 85 100 100 100"

; r.AntiAliasingMethod (TAA on Low and Medium, TSR above) cannot be set here: Scalability.ini only accepts variables flagged
; as scalability. IASettings::ApplyAntiAliasingForQuality sets it from the AntiAliasingQuality level.
[AntiAliasingQuality@2]
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=1
r.TSR.ShadingRejection.Flickering=0
r.TSR.RejectionAntiAliasingQuality=1
r.TSR.Resurrection=0

; The engine's Low level switches ALL dynamic shadows off (r.ShadowQuality=0): flat, unreadable maps. Keep one cheap sun cascade.
[ShadowQuality@0]
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.6
